<html>

<head>
    <link type="text/rcss" href="../../milligram.css" />
    <link type="text/rcss" href="../settings.css" />
    <script src="graphics.lua"></script>
    <script src="../../global.lua"></script>

</head>

<body id="graphicsSettings" onkeydown="graphicsSettingsKeyDown(event)" onload="documentInit(element)">
    <div class="main">
        <div class="top">
            <span>Graphics</span>
        </div>

        <div class="middle">
            <div class="buttonContainer" data-model="graphics">

                <button id="first" class="option" autofocus onclick="toggleTaa()">
                    <div class="label">TAA</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{taaLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>

                <button class="option">
                    <div class="label">TAA — Weight ({{format(taaWeightPercent,0)}}%)</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow" onmousedown="sliderArrowStep(event)">&#xe806;</p>
                            <p class="rightarrow" onmousedown="sliderArrowStep(event)">&#xe808;</p>
                            <input type="range" min="50" max="95" step="1" data-value="taaWeightPercent" style="tab-index:none;" onchange="taaWeightChange()" />
                        </div>
                    </div>
                </button>

                <button class="option">
                    <div class="label">Sharpening — RCAS ({{format(casStrengthPercent,0)}}%)</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow" onmousedown="sliderArrowStep(event)">&#xe806;</p>
                            <p class="rightarrow" onmousedown="sliderArrowStep(event)">&#xe808;</p>
                            <input type="range" min="0" max="150" step="1" data-value="casStrengthPercent" style="tab-index:none;" onchange="casStrengthChange()" />
                        </div>
                    </div>
                </button>

                <button class="option">
                    <div class="label">Resolution Scale ({{format(renderScalePercent,0)}}%)</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow" onmousedown="sliderArrowStep(event)">&#xe806;</p>
                            <p class="rightarrow" onmousedown="sliderArrowStep(event)">&#xe808;</p>
                            <input type="range" min="50" max="200" step="10" data-value="renderScalePercent" style="tab-index:none;" onchange="renderScaleChange()" />
                        </div>
                    </div>
                </button>

                <button class="option" id="toggleShadows" onmousedown="cycleButtonDown(event)" onclick="cycleButtonClick(event)">
                    <div class="label">Shadows</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{shadowsLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>

                <button class="option" id="toggleShadowQuality" data-class-disabled="shadowQualityDisabled" onmousedown="cycleButtonDown(event)" onclick="cycleButtonClick(event)">
                    <div class="label">Shadows — Quality</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{shadowQualityLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>


                <button class="option" id="toggleAo" onclick="toggleAo()">
                    <div class="label">Ambient Occlusion</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{aoLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>

                <button class="option">
                    <div class="label">AO — Radius ({{format(ssaoRadius,2)}})</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow" onmousedown="sliderArrowStep(event)">&#xe806;</p>
                            <p class="rightarrow" onmousedown="sliderArrowStep(event)">&#xe808;</p>
                            <input type="range" min="0.1" max="10" step="0.1" data-value="ssaoRadius" style="tab-index:none;" onchange="ssaoRadiusChange()" />
                        </div>
                    </div>
                </button>

                <button class="option" id="toggleSsaoAlgorithm" onmousedown="cycleButtonDown(event)" onclick="cycleButtonClick(event)">
                    <div class="label">AO — Method</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{ssaoAlgorithmLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>

                <button class="option">
                    <div class="label">AO — Intensity ({{format(ssaoIntensity,2)}})</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow" onmousedown="sliderArrowStep(event)">&#xe806;</p>
                            <p class="rightarrow" onmousedown="sliderArrowStep(event)">&#xe808;</p>
                            <input type="range" min="0" max="2" step="0.05" data-value="ssaoIntensity" style="tab-index:none;" onchange="ssaoIntensityChange()" />
                        </div>
                    </div>
                </button>

                <button class="option" id="toggleSsr" onclick="toggleSsr()">
                    <div class="label">Screen Space Reflections</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{ssrLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>

                <button class="option">
                    <div class="label">Reflections — Strength ({{format(ssrStrength,2)}})</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow" onmousedown="sliderArrowStep(event)">&#xe806;</p>
                            <p class="rightarrow" onmousedown="sliderArrowStep(event)">&#xe808;</p>
                            <input type="range" min="0" max="2" step="0.05" data-value="ssrStrength" style="tab-index:none;" onchange="ssrStrengthChange()" />
                        </div>
                    </div>
                </button>

                <button class="option" id="toggleGi" onclick="toggleGi()">
                    <div class="label">Global Illumination</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{giLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>

                <button class="option" id="toggleBloom" onclick="toggleBloom()">
                    <div class="label">Bloom</div>
                    <div class="widget">
                        <div class="slider">
                            <p class="leftarrow">&#xe806;</p>
                            <p>{{bloomLabel}}</p>
                            <p class="rightarrow">&#xe808;</p>
                        </div>
                    </div>
                </button>

                <div style="flex:1;"></div>
                <button id="last" onclick="graphicsClose()">
                    <div>BACK</div>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
